aid: chelsio-communications
name: Chelsio Communications
description: 'Chelsio Communications designs and sells high-performance Ethernet network adapters and
  ASICs — the Terminator (T4/T5/T6/T7) Unified Wire family — for virtualized enterprise datacenters,
  hyperscale public and private clouds, cluster computing, GPU-accelerated computing and high-frequency
  trading. Its 1/10/25/40/50/100GbE adapters fully offload TCP, iSCSI, FCoE, iWARP RDMA and NVMe-oF onto
  a single chip with single firmware, and the sixth-generation T6 ASIC adds integrated cryptography
  offload for IPsec/TLS/SSL/DTLS. Chelsio distributes Unified Wire driver packages for Linux, Windows,
  FreeBSD and VMware ESXi plus the Unified Wire Manager management software as downloads from its
  service portal; it publishes no public developer program, REST API or machine-readable API contract.'
